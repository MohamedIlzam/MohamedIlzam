          <path d="M40 52 L145 18 M40 52 L155 86 M145 18 L255 52 M155 86 L255 52" fill="none" stroke="#364152" stroke-width="3"/>
          <path d="M40 52 L145 18 M40 52 L155 86 M145 18 L255 52 M155 86 L255 52" fill="none" stroke="url(#blueLine)" stroke-width="4" stroke-dasharray="22 110">
            <animate attributeName="stroke-dashoffset" from="132" to="0" dur="1.6s" repeatCount="indefinite"/>
