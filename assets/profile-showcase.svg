      <g opacity="0" transform="translate(80 0)">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="0s" repeatCount="indefinite"/>

        <text x="0" y="552" fill="#58a6ff" font-size="13">01 / 04</text>
        <text x="0" y="584" fill="#f0f6fc" font-size="29" font-weight="700">Distributed Messaging System</text>
        <text x="0" y="613" fill="#b1bac4" font-size="14">Fault-tolerant cluster built around quorum replication and self-healing reads.</text>
        <text x="0" y="648" fill="#7d8590" font-size="12">STACK</text>
        <text x="54" y="648" fill="#d0d7de" font-size="12">Java · MySQL · HikariCP</text>

