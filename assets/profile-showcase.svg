        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>

        <text x="0" y="552" fill="#f59e0b" font-size="13">02 / 04</text>
        <text x="0" y="584" fill="#f0f6fc" font-size="29" font-weight="700">CalTrack</text>
        <text x="0" y="613" fill="#b1bac4" font-size="14">Mobile-first nutrition platform with an AI coach grounded in real user activity.</text>
        <text x="0" y="648" fill="#7d8590" font-size="12">STACK</text>
        <text x="54" y="648" fill="#d0d7de" font-size="12">Next.js · NestJS · Prisma · PostgreSQL/pgvector · Redis</text>

        <g transform="translate(808 546)">
          <text x="0" y="5" fill="#7d8590" font-size="10">USER</text>
          <text x="88" y="5" fill="#7d8590" font-size="10">API</text>
          <text x="168" y="5" fill="#7d8590" font-size="10">VECTOR</text>
          <text x="264" y="5" fill="#7d8590" font-size="10">AI</text>
          <path d="M18 36 H275" stroke="#364152" stroke-width="3"/>
          <path d="M18 36 H275" stroke="url(#goldLine)" stroke-width="4" stroke-dasharray="24 145">
            <animate attributeName="stroke-dashoffset" from="169" to="0" dur="1.9s" repeatCount="indefinite"/>
          </path>
          <g fill="#111827" stroke="#f59e0b" stroke-width="1.5">
            <circle cx="18" cy="36" r="13"/><circle cx="100" cy="36" r="13"/><circle cx="193" cy="36" r="13"/><circle cx="275" cy="36" r="13"/>
          </g>
          <circle r="5" fill="#fbbf24"><animateMotion dur="2s" repeatCount="indefinite" path="M18 36 H275"/></circle>
          <rect x="80" y="74" width="135" height="10" rx="5" fill="#1f2937"/>
          <rect x="80" y="74" width="35" height="10" rx="5" fill="#f59e0b">
            <animate attributeName="width" values="35;135;35" dur="2.4s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <g opacity="0" transform="translate(80 0)">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>

        <text x="0" y="552" fill="#58a6ff" font-size="13">03 / 04</text>
        <text x="0" y="584" fill="#f0f6fc" font-size="29" font-weight="700">Kodikara Bake House Management System</text>
        <text x="0" y="613" fill="#b1bac4" font-size="14">Containerized enterprise ERP covering daily operations, sales, payments, and reporting.</text>
        <text x="0" y="648" fill="#7d8590" font-size="12">STACK</text>
        <text x="54" y="648" fill="#d0d7de" font-size="12">Spring Boot · React · MySQL · Docker · Cypress</text>

        <g transform="translate(828 540)">
          <rect x="0" y="0" width="260" height="92" rx="18" fill="#101724" stroke="#334155"/>
          <rect x="24" y="18" width="212" height="18" rx="9" fill="#0f172a" stroke="#58a6ff"/>
          <text x="130" y="31" text-anchor="middle" fill="#d0d7de" font-size="10">APPLICATION</text>
          <rect x="24" y="44" width="212" height="18" rx="9" fill="#0f172a" stroke="#58a6ff"/>
          <text x="130" y="57" text-anchor="middle" fill="#d0d7de" font-size="10">CONTAINER</text>
          <rect x="24" y="68" width="212" height="8" rx="4" fill="#1f2937"/>
          <rect x="24" y="68" width="50" height="8" rx="4" fill="#58a6ff">
            <animate attributeName="width" values="45;212;45" dur="2.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="0" y="0" width="260" height="92" rx="18" fill="none" stroke="#58a6ff" opacity="0.12">
            <animate attributeName="opacity" values="0.08;0.35;0.08" dur="1.7s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <g opacity="0" transform="translate(80 0)">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>

        <text x="0" y="552" fill="#f59e0b" font-size="13">04 / 04</text>
        <text x="0" y="584" fill="#f0f6fc" font-size="29" font-weight="700">Skill Share</text>
        <text x="0" y="613" fill="#b1bac4" font-size="14">Peer-to-peer skill exchange platform with structured backend search and filtering.</text>
        <text x="0" y="648" fill="#7d8590" font-size="12">STACK</text>
        <text x="54" y="648" fill="#d0d7de" font-size="12">Java · Spring Boot · JPA</text>

        <g transform="translate(825 541)">
          <rect x="0" y="0" width="270" height="92" rx="18" fill="#101724" stroke="#334155"/>
          <text x="22" y="24" fill="#7d8590" font-size="10">QUERY</text>
          <rect x="22" y="33" width="226" height="13" rx="6.5" fill="#1f2937"/>
          <rect x="22" y="33" width="80" height="13" rx="6.5" fill="#f59e0b">
            <animate attributeName="width" values="40;210;80;170;40" dur="3s" repeatCount="indefinite"/>
          </rect>
          <g fill="#111827" stroke="#f59e0b">
            <circle cx="54" cy="70" r="11"/><circle cx="116" cy="70" r="11"/><circle cx="178" cy="70" r="11"/><circle cx="236" cy="70" r="11"/>
          </g>
          <circle r="5" fill="#fbbf24">
            <animate attributeName="cx" values="54;116;178;236;54" dur="2.8s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="70;70;70;70;70" dur="2.8s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>

      <g transform="translate(80 630)">
        <rect x="0" y="0" width="1040" height="4" rx="2" fill="#1f2937"/>
        <rect x="0" y="0" width="260" height="4" rx="2" fill="#58a6ff">
          <animate attributeName="x" values="0;0;260;260;520;520;780;780;0" keyTimes="0;0.24;0.25;0.49;0.50;0.74;0.75;0.99;1" dur="16s" repeatCount="indefinite"/>
