<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Ilzam — AI Systems Engineer</title>
  <desc id="desc">Cinematic animated GitHub profile hero showing agentic AI, RAG, distributed systems, and DevOps through a node topology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1f2937" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="468" rx="27" fill="none" stroke="#1f2937"/>

  <g opacity="0.55">
    <circle cx="885" cy="150" r="140" fill="url(#glowBlue)">
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="260" r="160" fill="url(#glowGold)">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="64" y="70" fill="#7d8590" font-size="14" letter-spacing="3">AGENTIC AI / RAG / DISTRIBUTED SYSTEMS / DEVOPS</text>
    <text x="64" y="146" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-2">MOHAMED ILZAM</text>
    <text x="64" y="192" fill="#58a6ff" font-size="25" font-weight="700">AI Systems Engineer</text>
    <text x="64" y="245" fill="#b1bac4" font-size="17">building agentic systems that retrieve context, use tools, and survive production.</text>

    <g transform="translate(64 308)">
      <rect x="0" y="-18" width="138" height="36" rx="18" fill="#0f172a" stroke="#22304b"/>
      <circle cx="20" cy="0" r="4.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="5" fill="#d0d7de" font-size="13">SYSTEM STATUS</text>
      <text x="114" y="5" fill="#3fb950" font-size="13">ONLINE</text>
    </g>

    <g transform="translate(735 55)">
      <path d="M120 165 L260 95 M120 165 L274 168 M120 165 L250 253 M274 168 L420 100 M274 168 L438 171 M250 253 L420 250" fill="none" stroke="#2d333b" stroke-width="2.2"/>
      <path d="M120 165 L260 95 M120 165 L274 168 M120 165 L250 253" fill="none" stroke="url(#cyanline)" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 150">
        <animate attributeName="stroke-dashoffset" from="176" to="0" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M274 168 L420 100 M274 168 L438 171 M250 253 L420 250" fill="none" stroke="url(#goldline)" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 145">
        <animate attributeName="stroke-dashoffset" from="167" to="0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
      </path>

      <circle cx="120" cy="165" r="56" fill="url(#glowBlue)" filter="url(#softGlow)"/>
      <circle cx="120" cy="165" r="36" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
      <circle cx="120" cy="165" r="49" fill="none" stroke="#58a6ff" opacity="0.18">
        <animate attributeName="r" values="46;58;46" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.20;0.05;0.20" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="120" y="171" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="700">AGENT</text>

      <g>
        <g fill="#111827" stroke="#3b4552" stroke-width="1.6">
          <circle cx="260" cy="95" r="28"/><circle cx="274" cy="168" r="28"/><circle cx="250" cy="253" r="28"/>
          <circle cx="420" cy="100" r="26"/><circle cx="438" cy="171" r="26"/><circle cx="420" cy="250" r="26"/>
        </g>
        <g fill="#d0d7de" font-size="11" font-weight="700" text-anchor="middle">
          <text x="260" y="99">RAG</text>
          <text x="274" y="172">MCP</text>
          <text x="250" y="257">STATE</text>
          <text x="420" y="104">TOOLS</text>
          <text x="438" y="175">CACHE</text>
          <text x="420" y="254">INFRA</text>
        </g>
      </g>

      <g fill="#58a6ff">
        <circle r="4.5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M120 165 L260 95"/></circle>
        <circle r="4.5"><animateMotion dur="2.9s" begin="0.4s" repeatCount="indefinite" path="M120 165 L274 168 L420 100"/></circle>
      </g>
      <g fill="#fbbf24">
        <circle r="4.5"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite" path="M120 165 L250 253 L420 250"/></circle>
        <circle r="4.5"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M274 168 L438 171"/></circle>
      </g>

      <g transform="translate(0 315)">
        <text x="0" y="0" fill="#7d8590" font-size="12" letter-spacing="2">CURRENT FOCUS</text>
        <text x="0" y="28" fill="#f0f6fc" font-size="14">agents  →  retrieval  →  orchestration  →  deployment</text>
      </g>
    </g>
  </g>
</svg>