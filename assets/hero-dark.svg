<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Ilzam — AI Systems Engineer</title>
  <desc id="desc">Cinematic animated GitHub hero with an exploded system stack representing agents, retrieval, backend architecture, and infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="45%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" fill="none" stroke="#1f2937" stroke-opacity="0.2" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="455" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="455" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="453" rx="27" fill="none" stroke="#1f2937"/>

  <circle cx="875" cy="210" r="170" fill="url(#blueGlow)">
    <animate attributeName="opacity" values="0.35;0.78;0.35" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="235" r="170" fill="url(#goldGlow)">
    <animate attributeName="opacity" values="0.16;0.46;0.16" dur="5.2s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="64" y="72" fill="#7d8590" font-size="14" letter-spacing="3">AI SYSTEMS / AGENTIC WORKFLOWS / BACKEND / INFRA</text>
    <text x="64" y="146" fill="#f0f6fc" font-size="56" font-weight="700" letter-spacing="-2">MOHAMED ILZAM</text>
    <text x="64" y="192" fill="#58a6ff" font-size="24" font-weight="700">AI Systems Engineer</text>
    <text x="64" y="238" fill="#b1bac4" font-size="17">I build intelligent systems that retrieve context, use tools, and ship into production.</text>

    <g transform="translate(64 308)">
      <rect x="0" y="-18" width="164" height="36" rx="18" fill="#0f172a" stroke="#22304b"/>
      <circle cx="20" cy="0" r="4.8" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="5" fill="#d0d7de" font-size="13">RUNTIME STATUS</text>
      <text x="122" y="5" fill="#3fb950" font-size="13" font-weight="700">READY</text>
    </g>

    <!-- exploded stack scene -->
    <g transform="translate(700 58)">
      <rect x="46" y="20" width="376" height="250" rx="26" fill="none" stroke="#263244"/>
      <path d="M234 50 V244" stroke="#334155" stroke-width="2.2"/>
      <path d="M234 50 V244" stroke="url(#blueLine)" stroke-width="4" stroke-linecap="round" stroke-dasharray="30 165">
        <animate attributeName="stroke-dashoffset" from="195" to="0" dur="2.2s" repeatCount="indefinite"/>
      </path>

      <!-- scanning beam -->
      <rect x="76" y="38" width="316" height="24" rx="12" fill="#58a6ff" opacity="0.06">
        <animate attributeName="y" values="38;224;38" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.03;0.10;0.03" dur="4.2s" repeatCount="indefinite"/>
      </rect>

      <!-- layer 1 -->
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 10 -8; 0 0" dur="4.2s" repeatCount="indefinite"/>
        <rect x="88" y="54" width="292" height="36" rx="14" fill="#0f172a" stroke="#2f3e55"/>
        <text x="112" y="77" fill="#d0d7de" font-size="13">AGENT ORCHESTRATION</text>
        <rect x="290" y="64" width="66" height="14" rx="7" fill="#1f2937"/>
        <rect x="290" y="64" width="36" height="14" rx="7" fill="#58a6ff">
          <animate attributeName="width" values="18;66;18" dur="2.6s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- layer 2 -->
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; -12 -2; 0 0" dur="4.7s" begin="0.2s" repeatCount="indefinite"/>
        <rect x="76" y="98" width="316" height="36" rx="14" fill="#101724" stroke="#334155"/>
        <text x="100" y="121" fill="#d0d7de" font-size="13">TOOLS / MCP CONNECTORS</text>
        <path d="M309 116 H360" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 42">
          <animate attributeName="stroke-dashoffset" from="56" to="0" dur="1.8s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- layer 3 -->
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 16 5; 0 0" dur="4.9s" begin="0.45s" repeatCount="indefinite"/>
        <rect x="92" y="142" width="284" height="36" rx="14" fill="#0f172a" stroke="#2f3e55"/>
        <text x="116" y="165" fill="#d0d7de" font-size="13">RETRIEVAL / MEMORY LAYER</text>
        <circle cx="338" cy="160" r="5" fill="#58a6ff">
          <animate attributeName="cx" values="308;350;308" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- layer 4 -->
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; -14 8; 0 0" dur="4.4s" begin="0.7s" repeatCount="indefinite"/>
        <rect x="74" y="186" width="320" height="36" rx="14" fill="#101724" stroke="#334155"/>
        <text x="98" y="209" fill="#d0d7de" font-size="13">BACKEND SERVICES</text>
        <circle cx="329" cy="204" r="4.5" fill="#fbbf24">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="347" cy="204" r="4.5" fill="#fbbf24">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- layer 5 -->
      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 8 12; 0 0" dur="4.6s" begin="1s" repeatCount="indefinite"/>
        <rect x="90" y="230" width="288" height="36" rx="14" fill="#0f172a" stroke="#2f3e55"/>
        <text x="114" y="253" fill="#d0d7de" font-size="13">CONTAINERS / DEPLOYMENT</text>
        <rect x="312" y="240" width="42" height="14" rx="7" fill="#1f2937"/>
        <rect x="312" y="240" width="42" height="14" rx="7" fill="none" stroke="#58a6ff" opacity="0.35">
          <animate attributeName="opacity" values="0.12;0.6;0.12" dur="1.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- data pulse -->
      <circle cx="234" cy="50" r="6" fill="#58a6ff">
        <animate attributeName="cy" values="50;244;50" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="234" cy="50" r="14" fill="none" stroke="#58a6ff" opacity="0.18">
        <animate attributeName="cy" values="50;244;50" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="7;18;7" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.24;0.04;0.24" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <text x="76" y="304" fill="#7d8590" font-size="12" letter-spacing="2">SYSTEM VIEW</text>
      <text x="76" y="330" fill="#f0f6fc" font-size="14">exploded architecture  →  layered motion  →  production flow</text>
    </g>
  </g>
</svg>