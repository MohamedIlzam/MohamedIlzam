<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="AI systems pipeline">
  <rect width="1200" height="210" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="208" rx="23" fill="none" stroke="#21262d"/>
