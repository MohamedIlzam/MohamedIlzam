<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Ilzam — AI Systems Engineer</title>
<desc id="desc">Animated GitHub profile with a fixed-position project reel.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070b"/>
    <stop offset="45%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#121826"/>
  </linearGradient>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0 L0 0 0 42" fill="none" stroke="#1f2937" stroke-opacity=".20"/>
  </pattern>

  <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#58a6ff"/>
    <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="blueGlow">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="goldGlow">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity=".24"/>
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect width="1200" height="675" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="673" rx="27" fill="none" stroke="#1f2937"/>

<circle cx="875" cy="210" r="170" fill="url(#blueGlow)">
