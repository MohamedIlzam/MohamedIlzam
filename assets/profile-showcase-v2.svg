</circle>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">

<!-- HERO -->
<rect x="34" y="36" width="1132" height="392" rx="28" fill="none" stroke="#1f2937"/>

<text x="88" y="94" fill="#7d8590" font-size="14" letter-spacing="3">AI SYSTEMS / AGENTIC WORKFLOWS / BACKEND / INFRA</text>
<text x="88" y="170" fill="#f0f6fc" font-size="58" font-weight="700" letter-spacing="-2">MOHAMED ILZAM</text>
<text x="88" y="216" fill="#58a6ff" font-size="25" font-weight="700">AI Systems Engineer</text>
<text x="88" y="270" fill="#b1bac4" font-size="17">I build intelligent systems that retrieve context, use tools, and ship into production.</text>

