<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Selected Systems — animated project reel</title>
  <desc id="desc">Four engineering projects cycle through with stack, architecture, and key implementation details.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="270" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="268" rx="23" fill="none" stroke="#1f2937"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="52" y="38" fill="#7d8590" font-size="13" letter-spacing="3">SELECTED SYSTEMS / AUTO REEL</text>

    <!-- Slide 1 -->
    <g opacity="0" transform="translate(80 0)">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="0s" repeatCount="indefinite"/>

      <text x="52" y="84" fill="#58a6ff" font-size="13">01 / 04</text>
      <text x="52" y="116" fill="#f0f6fc" font-size="29" font-weight="700">Distributed Messaging System</text>
      <text x="52" y="145" fill="#b1bac4" font-size="14">Fault-tolerant cluster built around quorum replication and self-healing reads.</text>

      <text x="52" y="181" fill="#7d8590" font-size="12">STACK</text>
      <text x="105" y="181" fill="#d0d7de" font-size="12">Java · MySQL · HikariCP</text>
      <text x="52" y="210" fill="#7d8590" font-size="12">CORE</text>
      <text x="105" y="210" fill="#d0d7de" font-size="12">LRU/SQL tiers · quorum consensus · active read repair · idempotent writes</text>

      <g transform="translate(820 78)">
        <path d="M40 52 L145 18 M40 52 L155 86 M145 18 L255 52 M155 86 L255 52" fill="none" stroke="#364152" stroke-width="3"/>
        <path d="M40 52 L145 18 M40 52 L155 86 M145 18 L255 52 M155 86 L255 52" fill="none" stroke="url(#blue)" stroke-width="4" stroke-dasharray="22 110">
          <animate attributeName="stroke-dashoffset" from="132" to="0" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <g fill="#111827" stroke="#58a6ff" stroke-width="1.5">
          <circle cx="40" cy="52" r="16"/><circle cx="145" cy="18" r="16"/><circle cx="155" cy="86" r="16"/><circle cx="255" cy="52" r="16"/>
        </g>
        <g fill="#d0d7de" font-size="10" text-anchor="middle">
          <text x="40" y="56">A</text><text x="145" y="22">B</text><text x="155" y="90">C</text><text x="255" y="56">SQL</text>
        </g>
        <circle r="5" fill="#58a6ff">
          <animateMotion dur="1.8s" repeatCount="indefinite" path="M40 52 L145 18 L255 52"/>
        </circle>
      </g>
    </g>

    <!-- Slide 2 -->
    <g opacity="0" transform="translate(80 0)">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="4s" repeatCount="indefinite"/>

      <text x="52" y="84" fill="#f59e0b" font-size="13">02 / 04</text>
      <text x="52" y="116" fill="#f0f6fc" font-size="29" font-weight="700">CalTrack</text>
      <text x="52" y="145" fill="#b1bac4" font-size="14">Mobile-first nutrition platform with an AI coach grounded in real user activity.</text>

      <text x="52" y="181" fill="#7d8590" font-size="12">STACK</text>
      <text x="105" y="181" fill="#d0d7de" font-size="12">Next.js · NestJS · Prisma · PostgreSQL/pgvector · Redis</text>
      <text x="52" y="210" fill="#7d8590" font-size="12">CORE</text>
      <text x="105" y="210" fill="#d0d7de" font-size="12">context-aware AI · Redis cache · vector retrieval · user activity grounding</text>

      <g transform="translate(808 82)">
        <text x="0" y="5" fill="#7d8590" font-size="10">USER</text>
        <text x="88" y="5" fill="#7d8590" font-size="10">API</text>
        <text x="168" y="5" fill="#7d8590" font-size="10">VECTOR</text>
        <text x="264" y="5" fill="#7d8590" font-size="10">AI</text>
        <path d="M18 36 H275" stroke="#364152" stroke-width="3"/>
        <path d="M18 36 H275" stroke="url(#gold)" stroke-width="4" stroke-dasharray="24 145">
          <animate attributeName="stroke-dashoffset" from="169" to="0" dur="1.9s" repeatCount="indefinite"/>
        </path>
        <g fill="#111827" stroke="#f59e0b" stroke-width="1.5">
          <circle cx="18" cy="36" r="13"/><circle cx="100" cy="36" r="13"/><circle cx="193" cy="36" r="13"/><circle cx="275" cy="36" r="13"/>
        </g>
        <circle r="5" fill="#fbbf24"><animateMotion dur="2s" repeatCount="indefinite" path="M18 36 H275"/></circle>
        <rect x="80" y="74" width="135" height="10" rx="5" fill="#1f2937"/>
        <rect x="80" y="74" width="35" height="10" rx="5" fill="#f59e0b">
          <animate attributeName="width" values="35;135;35" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <text x="147" y="104" fill="#7d8590" text-anchor="middle" font-size="10">retrieval + context flow</text>
      </g>
    </g>

    <!-- Slide 3 -->
    <g opacity="0" transform="translate(80 0)">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="8s" repeatCount="indefinite"/>

      <text x="52" y="84" fill="#58a6ff" font-size="13">03 / 04</text>
      <text x="52" y="116" fill="#f0f6fc" font-size="29" font-weight="700">Kodikara Bake House Management System</text>
      <text x="52" y="145" fill="#b1bac4" font-size="14">Containerized enterprise ERP covering daily operations, sales, payments, and reporting.</text>

      <text x="52" y="181" fill="#7d8590" font-size="12">STACK</text>
      <text x="105" y="181" fill="#d0d7de" font-size="12">Spring Boot · React · MySQL · Docker · Cypress</text>
      <text x="52" y="210" fill="#7d8590" font-size="12">CORE</text>
      <text x="105" y="210" fill="#d0d7de" font-size="12">REST services · operational workflows · container deployment · E2E automation</text>

      <g transform="translate(828 76)">
        <rect x="0" y="0" width="260" height="112" rx="18" fill="#101724" stroke="#334155"/>
        <rect x="24" y="22" width="212" height="22" rx="11" fill="#0f172a" stroke="#58a6ff"/>
        <text x="130" y="37" text-anchor="middle" fill="#d0d7de" font-size="10">APPLICATION</text>
        <rect x="24" y="54" width="212" height="22" rx="11" fill="#0f172a" stroke="#58a6ff"/>
        <text x="130" y="69" text-anchor="middle" fill="#d0d7de" font-size="10">CONTAINER</text>
        <rect x="24" y="86" width="212" height="10" rx="5" fill="#1f2937"/>
        <rect x="24" y="86" width="50" height="10" rx="5" fill="#58a6ff">
          <animate attributeName="width" values="45;212;45" dur="2.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="0" y="0" width="260" height="112" rx="18" fill="none" stroke="#58a6ff" opacity="0.12">
          <animate attributeName="opacity" values="0.08;0.35;0.08" dur="1.7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Slide 4 -->
    <g opacity="0" transform="translate(80 0)">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="80 0;0 0;0 0;-80 0;-80 0" keyTimes="0;0.04;0.20;0.25;1" dur="16s" begin="12s" repeatCount="indefinite"/>

      <text x="52" y="84" fill="#f59e0b" font-size="13">04 / 04</text>
      <text x="52" y="116" fill="#f0f6fc" font-size="29" font-weight="700">Skill Share</text>
      <text x="52" y="145" fill="#b1bac4" font-size="14">Peer-to-peer skill exchange platform with structured backend search and filtering.</text>

      <text x="52" y="181" fill="#7d8590" font-size="12">STACK</text>
      <text x="105" y="181" fill="#d0d7de" font-size="12">Java · Spring Boot · JPA</text>
      <text x="52" y="210" fill="#7d8590" font-size="12">CORE</text>
      <text x="105" y="210" fill="#d0d7de" font-size="12">JPA Specifications · dynamic multi-criteria search · service-layer architecture</text>

      <g transform="translate(825 79)">
        <rect x="0" y="0" width="270" height="108" rx="18" fill="#101724" stroke="#334155"/>
        <text x="22" y="28" fill="#7d8590" font-size="10">QUERY</text>
        <rect x="22" y="39" width="226" height="15" rx="7.5" fill="#1f2937"/>
        <rect x="22" y="39" width="80" height="15" rx="7.5" fill="#f59e0b">
          <animate attributeName="width" values="40;210;80;170;40" dur="3s" repeatCount="indefinite"/>
        </rect>
        <g fill="#111827" stroke="#f59e0b">
          <circle cx="54" cy="80" r="11"/><circle cx="116" cy="80" r="11"/><circle cx="178" cy="80" r="11"/><circle cx="236" cy="80" r="11"/>
        </g>
        <circle r="5" fill="#fbbf24">
          <animate attributeName="cx" values="54;116;178;236;54" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="80;80;80;80;80" dur="2.8s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- progress -->
    <g transform="translate(52 242)">
      <rect x="0" y="0" width="1096" height="4" rx="2" fill="#1f2937"/>
      <rect x="0" y="0" width="274" height="4" rx="2" fill="#58a6ff">
        <animate attributeName="x" values="0;0;274;274;548;548;822;822;0" keyTimes="0;0.24;0.25;0.49;0.50;0.74;0.75;0.99;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>