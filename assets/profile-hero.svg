<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Ilzam Ibrahim — AI Systems Engineer</title>
<desc id="desc">Intelligent software. Reliable infrastructure. AI agents, backend systems and cloud delivery.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e1d"/><stop offset="1" stop-color="#14223b"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity=".05"/></pattern>
</defs>
<style>
.flow{stroke-dasharray:7 14;animation:flow 3s linear infinite}
.halo{transform-origin:955px 223px;animation:orbit 32s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.intro{animation:enter 1.2s ease-out both}
@keyframes flow{to{stroke-dashoffset:-84}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.flow,.halo,.pulse,.cursor,.intro{animation:none}}
</style>
<rect x="1" y="1" width="1198" height="478" rx="24" fill="url(#bg)" stroke="#293954"/>
<rect x="1" y="1" width="1198" height="478" rx="24" fill="url(#grid)"/>
<path d="M48 1H1152" stroke="url(#accent)" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<g class="intro">
<text x="58" y="68" fill="#8da5c3" font-size="15" letter-spacing="3">AI / SOFTWARE / INFRASTRUCTURE</text>
<text x="58" y="144" fill="#f1f5ff" font-size="60" font-weight="700" letter-spacing="-2">Ilzam Ibrahim</text>
<text x="60" y="194" fill="#7dd3fc" font-size="29">AI Systems Engineer</text>
<text x="60" y="257" fill="#d4dfee" font-size="23">Intelligent software.</text>
<text x="60" y="291" fill="#d4dfee" font-size="23">Reliable infrastructure.</text>
<text x="60" y="338" fill="#8da5c3" font-size="17">Agentic AI &amp; RAG · Backend systems · CI/CD</text>
</g>
<g fill="none" stroke="#354867">
<circle cx="955" cy="223" r="137"/>
<circle cx="955" cy="223" r="109" stroke-dasharray="3 12"/>
<g class="halo"><circle cx="955" cy="86" r="6" fill="#a78bfa" stroke="none"/><circle cx="955" cy="360" r="4" fill="#7dd3fc" stroke="none"/></g>
<path d="M955 143V304M875 223H1035" stroke="#7dd3fc" class="flow"/>
</g>
<g fill="#101d33" stroke="#52678c">
<rect x="899" y="112" width="112" height="44" rx="12"/>
<rect x="899" y="290" width="112" height="44" rx="12"/>
<rect x="820" y="201" width="100" height="44" rx="12"/>
<rect x="990" y="201" width="100" height="44" rx="12"/>
<rect x="928" y="196" width="54" height="54" rx="16" stroke="#7dd3fc"/>
</g>
<g fill="#d4dfee" font-size="14" text-anchor="middle">
<text x="955" y="139">AGENTS</text><text x="955" y="317">CLOUD</text>
<text x="870" y="228">DATA</text><text x="1040" y="228">APIs</text>
<text x="955" y="231" fill="#7dd3fc" font-size="22" font-weight="bold">AI</text>
</g>
<circle cx="955" cy="223" r="40" fill="none" stroke="#7dd3fc" opacity=".7" class="pulse"/>
<path d="M58 382H1142" stroke="#293954"/>
<text x="60" y="433" fill="#8da5c3" font-size="16" font-family="monospace"><tspan fill="#7dd3fc">&gt;</tspan> build. understand. iterate.</text>
<rect class="cursor" x="370" y="418" width="9" height="19" fill="#7dd3fc"/>
<text x="1140" y="433" text-anchor="end" fill="#a7b9d1" font-size="15">JAVA / PYTHON / TYPESCRIPT / C# / C</text>
</g></svg>